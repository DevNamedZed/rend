name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1

      - name: Restore
        run: dotnet restore Rend.sln

      - name: Build
        run: dotnet build Rend.sln --no-restore --configuration Release -p:BUILD_NUMBER=${{ github.run_number }}

      - name: Test
        run: dotnet test Rend.sln --no-build --configuration Release --verbosity normal

      - name: Pack (validate)
        run: dotnet pack Rend.sln --no-build --configuration Release --output ./nupkg -p:BUILD_NUMBER=${{ github.run_number }}

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-${{ matrix.os }}
          path: ./nupkg/*.nupkg
          retention-days: 7

  visual-regression:
    runs-on: windows-latest
    needs: build

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Rend.sln

      - name: Build
        run: dotnet build conformance/Rend.VisualRegression/Rend.VisualRegression.csproj --configuration Release

      - name: Run visual regression tests
        run: dotnet run --project conformance/Rend.VisualRegression/Rend.VisualRegression.csproj --configuration Release
        continue-on-error: true

      - name: Upload visual regression report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-regression-report
          path: |
            conformance/Rend.VisualRegression/results/report.html
            conformance/Rend.VisualRegression/results/results.json
          retention-days: 30

      - name: Upload full visual regression output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-regression-full
          path: conformance/Rend.VisualRegression/output/
          retention-days: 7
