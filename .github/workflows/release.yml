name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore Rend.sln

      - name: Build
        run: dotnet build Rend.sln --no-restore --configuration Release -p:VersionPrefix=${{ steps.version.outputs.VERSION }}

      - name: Test
        run: dotnet test Rend.sln --no-build --configuration Release --verbosity normal

      - name: Pack
        run: |
          dotnet pack src/Rend.Core/Rend.Core.csproj --no-build --configuration Release -p:VersionPrefix=${{ steps.version.outputs.VERSION }} --output ./nupkg
          dotnet pack src/Rend.Css/Rend.Css.csproj --no-build --configuration Release -p:VersionPrefix=${{ steps.version.outputs.VERSION }} --output ./nupkg
          dotnet pack src/Rend.Html/Rend.Html.csproj --no-build --configuration Release -p:VersionPrefix=${{ steps.version.outputs.VERSION }} --output ./nupkg
          dotnet pack src/Rend.Pdf/Rend.Pdf.csproj --no-build --configuration Release -p:VersionPrefix=${{ steps.version.outputs.VERSION }} --output ./nupkg
          dotnet pack src/Rend/Rend.csproj --no-build --configuration Release -p:VersionPrefix=${{ steps.version.outputs.VERSION }} --output ./nupkg

      - name: Verify packages
        shell: bash
        run: |
          echo "=== Packages ==="
          ls -la ./nupkg/
          echo ""
          for pkg in ./nupkg/*.nupkg; do
            echo "--- $(basename $pkg) ---"
            dotnet nuget verify "$pkg" --all 2>/dev/null || true
          done

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./nupkg/*.nupkg
          retention-days: 30

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ./nupkg/*.nupkg
