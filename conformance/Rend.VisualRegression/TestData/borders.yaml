                          <div style="width:200px; height:80px; background:#3498db; border-radius:20px 0 20px 0; margin-bottom:10px;"></div>
                          <div style="width:200px; height:80px; background:#e74c3c; border-radius:0 30px 0 30px;"></div>
                      </body></html>

