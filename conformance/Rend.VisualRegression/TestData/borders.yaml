# Borders
# Visual regression tests for borders
tests:
  - id: adv-border-mixed-styles
    name: Mixed Border Styles Per Side
    html: |
      <html><body style="margin:0; padding:20px;">
                          <div style="border-top:4px solid #e74c3c; border-right:4px dashed #3498db; border-bottom:4px dotted #27ae60; border-left:4px double #f39c12; padding:20px; height:60px; background:#f9f9f9;"></div>
                      </body></html>

  - id: adv-border-collapse-table
    name: Border Collapse on Table
    html: |
      <html><body style="margin:0; padding:10px; font-family:Arial,sans-serif; font-size:14px; line-height:1.4;">
                          <table style="border-collapse:collapse; width:100%;">
                              <tr>
                                  <td style="border:2px solid #2c3e50; padding:8px; background:#ecf0f1;">A1</td>
                                  <td style="border:2px solid #2c3e50; padding:8px; background:#ecf0f1;">A2</td>
                                  <td style="border:2px solid #2c3e50; padding:8px; background:#ecf0f1;">A3</td>
                              </tr>
                              <tr>
                                  <td style="border:2px solid #2c3e50; padding:8px; background:#ecf0f1;">B1</td>
                                  <td style="border:2px solid #2c3e50; padding:8px; background:#ecf0f1;">B2</td>
                                  <td style="border:2px solid #2c3e50; padding:8px; background:#ecf0f1;">B3</td>
                              </tr>
                              <tr>
                                  <td style="border:2px solid #2c3e50; padding:8px; background:#ecf0f1;">C1</td>
                                  <td style="border:2px solid #2c3e50; padding:8px; background:#ecf0f1;">C2</td>
                                  <td style="border:2px solid #2c3e50; padding:8px; background:#ecf0f1;">C3</td>
                              </tr>
                          </table>
                      </body></html>

  - id: adv-border-outline
    name: Outline Versus Border
    html: |
      <html><body style="margin:0; padding:20px;">
                          <div style="width:150px; height:50px; border:3px solid #3498db; margin-bottom:20px; background:#ecf0f1;"></div>
                          <div style="width:150px; height:50px; outline:3px solid #e74c3c; background:#ecf0f1;"></div>
                      </body></html>

  - id: bug049-border-reset-image
    name: border shorthand resets border-image
    html: |
      <html><body style="margin:0; padding:20px; font-family:sans-serif; font-size:14px;">
      <div style="border-image:linear-gradient(red,blue) 10; width:200px; height:60px; padding:8px; margin-bottom:10px;">Has border-image</div>
      <div style="border-image:linear-gradient(red,blue) 10; border:3px solid #333; width:200px; height:60px; padding:8px;">border: overrides border-image</div>
      </body></html>

  - id: bug049-border-cascade
    name: border-image then border shorthand cascade
    html: |
      <html><head><style>
      .box { width:180px; height:50px; padding:8px; margin:6px; font-family:sans-serif; font-size:12px; }
      .has-image { border-image: linear-gradient(45deg, #3498db, #e74c3c) 1; }
      .reset { border: 3px solid #333; }
      </style></head><body style="margin:0; padding:10px;">
      <div class="box has-image">border-image only</div>
      <div class="box has-image reset">border-image then border (should show solid)</div>
      <div class="box reset">border only (solid #333)</div>
      </body></html>

