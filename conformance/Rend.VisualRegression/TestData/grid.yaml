# Grid
# Visual regression tests for grid
tests:
  - id: grid-span
    name: Grid Column Span
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px;">
                              <div style="grid-column:span 2; background:#3498db; height:40px;"></div>
                              <div style="background:#e74c3c; height:40px;"></div>
                              <div style="background:#27ae60; height:40px;"></div>
                              <div style="grid-column:span 2; background:#f39c12; height:40px;"></div>
                          </div>
                      </body></html>

  - id: grid-row-span
    name: Grid Row Span
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:40px; gap:6px;">
                              <div style="grid-row:span 2; background:#3498db;"></div>
                              <div style="background:#e74c3c;"></div>
                              <div style="background:#27ae60;"></div>
                          </div>
                      </body></html>

  - id: grid-mixed-units
    name: "Grid Mixed Units (px, fr, %)"
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="display:grid; grid-template-columns:80px 1fr 25%; gap:8px;">
                              <div style="background:#3498db; height:50px;"></div>
                              <div style="background:#e74c3c; height:50px;"></div>
                              <div style="background:#27ae60; height:50px;"></div>
                          </div>
                      </body></html>

  - id: grid-align-items
    name: Grid Align/Justify Items
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:80px; gap:6px; align-items:center; justify-items:center;">
                              <div style="background:#3498db; width:60px; height:30px;"></div>
                              <div style="background:#e74c3c; width:60px; height:30px;"></div>
                              <div style="background:#27ae60; width:60px; height:30px;"></div>
                              <div style="background:#f39c12; width:60px; height:30px;"></div>
                          </div>
                      </body></html>

  - id: adv-grid-template-areas
    name: Grid Template Areas
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="display:grid; grid-template-areas:'header header header' 'sidebar main main' 'footer footer footer'; grid-template-rows:40px 1fr 30px; grid-template-columns:80px 1fr 1fr; gap:4px; height:200px;">
                              <div style="grid-area:header; background:#2c3e50;"></div>
                              <div style="grid-area:sidebar; background:#34495e;"></div>
                              <div style="grid-area:main; background:#3498db;"></div>
                              <div style="grid-area:footer; background:#7f8c8d;"></div>
                          </div>
                      </body></html>

  - id: adv-grid-auto-placement
    name: Grid Auto Placement with Varying Sizes
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="display:grid; grid-template-columns:repeat(4, 1fr); grid-auto-rows:40px; gap:4px;">
                              <div style="background:#3498db;"></div>
                              <div style="background:#e74c3c; grid-column:span 2;"></div>
                              <div style="background:#27ae60;"></div>
                              <div style="background:#f39c12;"></div>
                              <div style="background:#9b59b6; grid-column:span 3;"></div>
                              <div style="background:#1abc9c;"></div>
                              <div style="background:#e67e22;"></div>
                          </div>
                      </body></html>

  - id: adv-grid-span-both
