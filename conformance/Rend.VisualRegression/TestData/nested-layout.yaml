# Nested Layout
# Visual regression tests for nested layout
tests:
  - id: nested-grid-in-flex
    name: Grid inside Flex Container
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="display:flex; gap:10px;">
                              <div style="flex:1; display:grid; grid-template-columns:1fr 1fr; gap:4px; background:#f0f0f0; padding:6px;">
                                  <div style="background:#3498db; height:30px;"></div>
                                  <div style="background:#2980b9; height:30px;"></div>
                              </div>
                              <div style="flex:1; background:#e74c3c; height:72px;"></div>
                          </div>
                      </body></html>

  - id: nested-flex-in-flex
    name: Flex inside Flex Container
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="display:flex; gap:8px;">
                              <div style="flex:1; display:flex; flex-direction:column; gap:4px;">
                                  <div style="background:#3498db; height:30px;"></div>
                                  <div style="background:#2980b9; height:30px;"></div>
                              </div>
                              <div style="flex:2; display:flex; gap:4px;">
                                  <div style="flex:1; background:#e74c3c; height:64px;"></div>
                                  <div style="flex:1; background:#c0392b; height:64px;"></div>
                              </div>
                          </div>
                      </body></html>

  - id: nested-absolute-in-flex
    name: Absolute Positioning in Flex Item
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="display:flex; gap:10px;">
                              <div style="flex:1; position:relative; background:#f0f0f0; height:80px;">
                                  <div style="position:absolute; top:10px; left:10px; width:40px; height:40px; background:#3498db;"></div>
                                  <div style="position:absolute; bottom:10px; right:10px; width:40px; height:40px; background:#e74c3c;"></div>
                              </div>
                              <div style="flex:1; background:#27ae60; height:80px;"></div>
                          </div>
                      </body></html>

  - id: nested-deep-boxes
    name: Deeply Nested Box Model
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="background:#ecf0f1; padding:10px;">
                              <div style="background:#bdc3c7; padding:10px;">
                                  <div style="background:#95a5a6; padding:10px;">
                                      <div style="background:#7f8c8d; padding:10px;">
                                          <div style="background:#3498db; height:30px;"></div>
                                      </div>
                                  </div>
                              </div>
                          </div>
                      </body></html>

  - id: nested-grid-2x2
    name: Grid 2x2 with Nested Content
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                              <div style="background:#f0f0f0; padding:8px;">
                                  <div style="background:#3498db; height:30px; margin-bottom:4px;"></div>
                                  <div style="background:#2980b9; height:20px;"></div>
                              </div>
                              <div style="background:#f0f0f0; padding:8px;">
                                  <div style="background:#e74c3c; height:50px;"></div>
                              </div>
                              <div style="background:#f0f0f0; padding:8px;">
                                  <div style="background:#27ae60; height:40px;"></div>
                              </div>
                              <div style="background:#f0f0f0; padding:8px;">
                                  <div style="background:#f39c12; height:25px; margin-bottom:4px;"></div>
                                  <div style="background:#e67e22; height:25px;"></div>
                              </div>
                          </div>
                      </body></html>

  - id: nested-flex-column-in-row
    name: Column Flex inside Row Flex
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="display:flex; gap:8px; height:120px;">
                              <div style="flex:1; display:flex; flex-direction:column; justify-content:space-between;">
                                  <div style="background:#3498db; height:30px;"></div>
                                  <div style="background:#2980b9; height:30px;"></div>
                              </div>
                              <div style="flex:1; display:flex; flex-direction:column; justify-content:center; gap:4px;">
                                  <div style="background:#e74c3c; height:25px;"></div>
                                  <div style="background:#c0392b; height:25px;"></div>
                              </div>
                              <div style="flex:1; background:#27ae60;"></div>
                          </div>
                      </body></html>

  - id: nested-boxes
    name: Nested Boxes with Padding
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="background:#3498db; padding:15px;">
                              <div style="background:#2980b9; padding:15px;">
                                  <div style="background:#1a6fa1; height:60px;"></div>
                              </div>
                          </div>
                      </body></html>

  - id: nested-flex-in-grid
    name: Flex inside Grid
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                              <div style="display:flex; gap:5px; background:#f0f0f0; padding:8px;">
                                  <div style="background:#3498db; flex:1; height:40px;"></div>
                                  <div style="background:#2980b9; flex:1; height:40px;"></div>
                              </div>
                              <div style="display:flex; flex-direction:column; gap:5px; background:#f0f0f0; padding:8px;">
                                  <div style="background:#e74c3c; height:20px;"></div>
                                  <div style="background:#c0392b; height:20px;"></div>
                              </div>
                          </div>
                      </body></html>

  - id: nested-margin-collapse
    name: Margin Collapsing
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="background:#3498db; height:40px; margin-bottom:20px;"></div>
                          <div style="background:#e74c3c; height:40px; margin-top:30px; margin-bottom:20px;"></div>
                          <div style="background:#27ae60; height:40px; margin-top:10px;"></div>
                      </body></html>

  - id: nested-card-layout
    name: Card Layout Pattern
    html: |
      <html><body style="margin:0; padding:10px; font-family:sans-serif; font-size:14px; line-height:1.4; background:#f0f0f0;">
                          <div style="display:flex; gap:10px;">
                              <div style="flex:1; background:#fff; border:1px solid #ddd; border-radius:4px; overflow:hidden;">
                                  <div style="background:#3498db; height:60px;"></div>
                                  <div style="padding:10px; height:20px;">Card 1</div>
                              </div>
                              <div style="flex:1; background:#fff; border:1px solid #ddd; border-radius:4px; overflow:hidden;">
                                  <div style="background:#e74c3c; height:60px;"></div>
                                  <div style="padding:10px; height:20px;">Card 2</div>
                              </div>
                              <div style="flex:1; background:#fff; border:1px solid #ddd; border-radius:4px; overflow:hidden;">
                                  <div style="background:#27ae60; height:60px;"></div>
                                  <div style="padding:10px; height:20px;">Card 3</div>
                              </div>
                          </div>
                      </body></html>

  - id: pp-nested-padding
    name: Nested Padding Boxes
    html: |
      <html><body style="margin:0; padding:10px; background:#fff;">
                          <div style="padding:15px; background:#ecf0f1; width:250px;">
                              <div style="padding:10px; background:#bdc3c7;">
                                  <div style="height:50px; background:#3498db;"></div>
                              </div>
                          </div>
                      </body></html>

  - id: pp-nested-flex-center
    name: Nested Flex Centering
    html: |
      <html><body style="margin:0; background:#ecf0f1; display:flex; align-items:center; justify-content:center; height:300px;">
                          <div style="display:flex; align-items:center; justify-content:center; width:200px; height:150px; background:#fff; border-radius:8px;">
                              <div style="width:60px; height:60px; background:#3498db; border-radius:50%;"></div>
                          </div>
                      </body></html>

  - id: pp-nested-flex-row-col
    name: Nested Flex Row Column
    html: |
      <html><body style="margin:0; padding:10px; background:#fff;">
                          <div style="display:flex; gap:10px; height:120px;">
                              <div style="display:flex; flex-direction:column; gap:5px; flex:1;">
                                  <div style="flex:1; background:#3498db;"></div>
                                  <div style="flex:1; background:#2ecc71;"></div>
                              </div>
                              <div style="display:flex; flex-direction:column; gap:5px; flex:1;">
                                  <div style="flex:2; background:#e74c3c;"></div>
                                  <div style="flex:1; background:#f39c12;"></div>
                              </div>
                          </div>
                      </body></html>

  - id: pp-nested-absolute
    name: Nested Absolute Positioning
    html: |
      <html><body style="margin:0; padding:10px; background:#fff;">
                          <div style="position:relative; width:300px; height:200px; background:#ecf0f1;">
                              <div style="position:absolute; top:10px; left:10px; width:120px; height:80px; background:#3498db;">
                                  <div style="position:absolute; bottom:5px; right:5px; width:40px; height:30px; background:#2c3e50;"></div>
                              </div>
                              <div style="position:absolute; bottom:10px; right:10px; width:100px; height:60px; background:#e74c3c;"></div>
                          </div>
                      </body></html>

  - id: pp-nested-grid-flex
    name: Grid with Flex Children
    html: |
      <html><body style="margin:0; padding:10px; background:#fff;">
                          <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; width:300px;">
                              <div style="display:flex; gap:5px; height:60px;">
                                  <div style="flex:1; background:#3498db;"></div>
                                  <div style="flex:1; background:#2c3e50;"></div>
                              </div>
                              <div style="display:flex; flex-direction:column; gap:5px; height:60px;">
                                  <div style="flex:1; background:#e74c3c;"></div>
                                  <div style="flex:1; background:#f39c12;"></div>
                              </div>
                          </div>
                      </body></html>

  - id: pp-nested-percentage-width
    name: Nested Percentage Widths
    html: |
      <html><body style="margin:0; padding:10px; background:#fff;">
                          <div style="width:300px; background:#ecf0f1; padding:10px;">
                              <div style="width:50%; height:30px; background:#3498db; margin-bottom:5px;"></div>
                              <div style="width:75%; height:30px; background:#e74c3c; margin-bottom:5px;"></div>
                              <div style="width:100%; height:30px; background:#2ecc71;"></div>
                          </div>
                      </body></html>

  - id: pp-nested-grid-2x2
    name: Nested Grid 2x2 in Container
    html: |
      <html><body style="margin:0; padding:10px; background:#fff;">
                          <div style="width:300px; background:#ecf0f1; padding:10px; border-radius:8px;">
                              <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                                  <div style="height:60px; background:#3498db; border-radius:4px;"></div>
                                  <div style="height:60px; background:#e74c3c; border-radius:4px;"></div>
                                  <div style="height:60px; background:#2ecc71; border-radius:4px;"></div>
                                  <div style="height:60px; background:#f39c12; border-radius:4px;"></div>
                              </div>
                          </div>
                      </body></html>

  - id: pp-nested-flex-grid
    name: Flex Inside Grid
    html: |
      <html><body style="margin:0; padding:10px; background:#fff;">
                          <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; width:300px;">
                              <div style="display:flex; gap:5px; padding:5px; background:#ecf0f1;">
                                  <div style="flex:1; height:30px; background:#3498db;"></div>
                                  <div style="flex:1; height:30px; background:#e74c3c;"></div>
                              </div>
                              <div style="display:flex; flex-direction:column; gap:5px; padding:5px; background:#ecf0f1;">
                                  <div style="height:30px; background:#2ecc71;"></div>
                                  <div style="height:30px; background:#f39c12;"></div>
                              </div>
                          </div>
                      </body></html>

  - id: pp-nested-flex-row-col-2
    name: Nested Flex Row in Column
    html: |
      <html><body style="margin:0; padding:20px; background:#fff;">
                          <div style="display:flex; flex-direction:column; gap:10px;">
                              <div style="display:flex; gap:10px;">
                                  <div style="width:80px; height:40px; background:#3498db;"></div>
                                  <div style="width:80px; height:40px; background:#e74c3c;"></div>
                              </div>
                              <div style="display:flex; gap:10px;">
                                  <div style="width:80px; height:40px; background:#2ecc71;"></div>
                                  <div style="width:80px; height:40px; background:#f39c12;"></div>
                              </div>
                          </div>
                      </body></html>

  - id: pp-nested-grid-in-flex
    name: Grid Inside Flex Item
    html: |
      <html><body style="margin:0; padding:20px; background:#fff;">
                          <div style="display:flex; gap:10px;">
                              <div style="flex:1; display:grid; grid-template-columns:1fr 1fr; gap:5px;">
                                  <div style="height:40px; background:#3498db;"></div>
                                  <div style="height:40px; background:#e74c3c;"></div>
                                  <div style="height:40px; background:#2ecc71;"></div>
                                  <div style="height:40px; background:#f39c12;"></div>
                              </div>
                              <div style="flex:1; height:90px; background:#9b59b6;"></div>
                          </div>
                      </body></html>

  - id: pp-nested-flex-stretch
    name: Nested Flex with Stretch
    html: |
      <html><body style="margin:0; padding:20px; background:#fff;">
                          <div style="display:flex; width:300px; height:120px; gap:10px;">
                              <div style="flex:1; display:flex; flex-direction:column; gap:5px;">
                                  <div style="flex:1; background:#3498db;"></div>
                                  <div style="flex:1; background:#2ecc71;"></div>
                              </div>
                              <div style="flex:2; background:#e74c3c;"></div>
                          </div>
                      </body></html>

  - id: pp-nested-grid-in-grid
    name: Grid Nested in Grid Cell
    html: |
      <html><body style="margin:0; padding:10px; background:#fff;">
                          <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; width:300px;">
                              <div style="display:grid; grid-template-columns:1fr 1fr; gap:4px;">
                                  <div style="height:30px; background:#3498db;"></div>
                                  <div style="height:30px; background:#e74c3c;"></div>
                              </div>
                              <div style="height:30px; background:#2ecc71;"></div>
                          </div>
                      </body></html>

  - id: pp-nested-flex-in-flex
    name: Flex Container Inside Flex Item
    html: |
      <html><body style="margin:0; padding:10px; background:#fff;">
                          <div style="display:flex; gap:8px; width:300px;">
                              <div style="display:flex; flex-direction:column; gap:4px; flex:1;">
                                  <div style="height:25px; background:#3498db;"></div>
                                  <div style="height:25px; background:#e74c3c;"></div>
                              </div>
                              <div style="flex:2; height:54px; background:#2ecc71;"></div>
                          </div>
                      </body></html>
