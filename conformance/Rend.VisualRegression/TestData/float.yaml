# Float
# Visual regression tests for float
tests:
  - id: float-multiple
    name: Multiple Floated Elements
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="float:left; width:60px; height:60px; background:#3498db; margin:0 8px 8px 0;"></div>
                          <div style="float:left; width:60px; height:60px; background:#e74c3c; margin:0 8px 8px 0;"></div>
                          <div style="float:left; width:60px; height:60px; background:#27ae60; margin:0 8px 8px 0;"></div>
                          <div style="clear:both;"></div>
                          <div style="background:#f0f0f0; height:30px;"></div>
                      </body></html>

  - id: float-both-sides
    name: Float Left and Right
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="overflow:hidden; background:#f0f0f0; padding:8px;">
                              <div style="float:left; width:80px; height:60px; background:#3498db;"></div>
                              <div style="float:right; width:80px; height:60px; background:#e74c3c;"></div>
                          </div>
                      </body></html>

  - id: adv-float-with-margin
    name: Float with Margin Spacing
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="overflow:hidden; background:#f0f0f0; padding:8px;">
                              <div style="float:left; width:100px; height:80px; background:#3498db; margin:0 16px 8px 0;"></div>
                              <div style="background:#ecf0f1; height:20px; margin-bottom:4px;"></div>
                              <div style="background:#e0e0e0; height:20px; margin-bottom:4px;"></div>
                              <div style="background:#d0d0d0; height:20px;"></div>
                          </div>
                      </body></html>

  - id: adv-float-image-boxes
    name: Floated Image-Like Boxes
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="overflow:hidden;">
                              <div style="float:left; width:60px; height:60px; background:#3498db; margin:0 10px 10px 0; border-radius:4px;"></div>
                              <div style="float:left; width:60px; height:60px; background:#e74c3c; margin:0 10px 10px 0; border-radius:4px;"></div>
                              <div style="float:left; width:60px; height:60px; background:#27ae60; margin:0 10px 10px 0; border-radius:4px;"></div>
                              <div style="float:left; width:60px; height:60px; background:#f39c12; margin:0 10px 10px 0; border-radius:4px;"></div>
                              <div style="float:left; width:60px; height:60px; background:#9b59b6; margin:0 10px 10px 0; border-radius:4px;"></div>
                              <div style="clear:both;"></div>
                              <div style="background:#ecf0f1; height:30px; border-radius:4px;"></div>
                          </div>
                      </body></html>

  - id: adv-float-clear-both
    name: Float Left and Right with Clear Both
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="overflow:hidden; background:#f0f0f0; padding:8px;">
                              <div style="float:left; width:100px; height:60px; background:#3498db;"></div>
                              <div style="float:right; width:100px; height:80px; background:#e74c3c;"></div>
                              <div style="clear:both;"></div>
                              <div style="background:#27ae60; height:30px; margin-top:4px;"></div>
                          </div>
                      </body></html>

  - id: float-clearfix
    name: Float Clearfix with Overflow Hidden
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="overflow:hidden; background:#f0f0f0; padding:8px; margin-bottom:10px;">
                              <div style="float:left; width:100px; height:60px; background:#3498db; margin-right:8px;"></div>
                              <div style="float:left; width:100px; height:80px; background:#e74c3c;"></div>
                          </div>
                          <div style="background:#27ae60; height:30px;"></div>
                      </body></html>

  - id: float-wrap-text
    name: Float with Block Content Wrapping
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="overflow:hidden;">
                              <div style="float:left; width:80px; height:80px; background:#3498db; margin:0 10px 10px 0;"></div>
                              <div style="background:#f0f0f0; height:30px; margin-bottom:4px;"></div>
                              <div style="background:#e0e0e0; height:30px; margin-bottom:4px;"></div>
                              <div style="background:#d0d0d0; height:30px;"></div>
                          </div>
                      </body></html>

  - id: float-left
    name: Float Left
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="float:left; width:80px; height:80px; background:#3498db; margin-right:10px;"></div>
                          <div style="float:left; width:80px; height:80px; background:#e74c3c; margin-right:10px;"></div>
                          <div style="float:left; width:80px; height:80px; background:#27ae60;"></div>
                      </body></html>

  - id: float-right
    name: Float Right
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="float:right; width:80px; height:80px; background:#3498db; margin-left:10px;"></div>
                          <div style="float:right; width:80px; height:80px; background:#e74c3c; margin-left:10px;"></div>
                          <div style="float:right; width:80px; height:80px; background:#27ae60;"></div>
                      </body></html>

  - id: float-clear
    name: Float with Clear
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="float:left; width:150px; height:60px; background:#3498db; margin-right:10px;"></div>
                          <div style="float:left; width:150px; height:60px; background:#e74c3c;"></div>
                          <div style="clear:both; background:#27ae60; height:40px; margin-top:5px;"></div>
                      </body></html>

  - id: float-text-wrap
    name: Float with Inline Text Wrapping
    html: |
      <html><body style="margin:0; padding:10px; font-family:sans-serif; font-size:13px; background:#fff;">
                          <div>
                              <div style="float:left; width:60px; height:60px; background:#3498db; margin:0 8px 4px 0;"></div>
                              <span>Text wraps around the floated element. More text here to demonstrate wrapping behavior around a left-floated box element.</span>
                          </div>
                      </body></html>

  - id: pp-float-layout
    name: Float Layout
    html: |
      <html><body style="margin:0; padding:10px; background:#fff;">
                          <div style="overflow:hidden;">
                              <div style="float:left; width:100px; height:80px; background:#3498db; margin-right:10px;"></div>
                              <div style="float:left; width:100px; height:80px; background:#e74c3c; margin-right:10px;"></div>
                              <div style="float:right; width:100px; height:80px; background:#2ecc71;"></div>
                          </div>
                      </body></html>

  - id: pp-float-wrap-geometry
    name: Float Wrap Geometry
    html: |
      <html><body style="margin:0; padding:10px; background:#fff;">
                          <div style="width:250px;">
                              <div style="float:left; width:80px; height:80px; background:#3498db; margin-right:10px;"></div>
                              <div style="height:30px; background:#ecf0f1; margin-bottom:5px;"></div>
                              <div style="height:30px; background:#bdc3c7; margin-bottom:5px;"></div>
                              <div style="height:30px; background:#95a5a6;"></div>
                          </div>
                      </body></html>

  - id: pp-float-right-box
    name: Float Right Box
    html: |
      <html><body style="margin:0; padding:10px; background:#fff;">
                          <div style="width:300px; overflow:hidden;">
                              <div style="float:right; width:100px; height:60px; background:#e74c3c;"></div>
                              <div style="height:30px; background:#3498db; margin-bottom:5px;"></div>
                              <div style="height:30px; background:#2ecc71;"></div>
                          </div>
                      </body></html>

  - id: pp-float-both-sides
    name: Float Left and Right
    html: |
      <html><body style="margin:0; padding:10px; background:#fff;">
                          <div style="overflow:hidden; width:300px;">
                              <div style="float:left; width:80px; height:60px; background:#3498db;"></div>
                              <div style="float:right; width:80px; height:60px; background:#e74c3c;"></div>
                              <div style="height:30px; background:#2ecc71; margin:0 90px;"></div>
                          </div>
                      </body></html>

  - id: pp-float-left-wrap
    name: Float Left with Block After
    html: |
      <html><body style="margin:0; padding:20px; background:#fff;">
                          <div style="width:300px;">
                              <div style="float:left; width:80px; height:80px; background:#3498db; margin-right:10px;"></div>
                              <div style="height:40px; background:#e74c3c;"></div>
                              <div style="height:40px; background:#2ecc71; margin-top:10px;"></div>
                          </div>
                      </body></html>

  - id: pp-float-both-sides-2
    name: Float Left and Right
    html: |
      <html><body style="margin:0; padding:20px; background:#fff;">
                          <div style="width:300px; overflow:hidden;">
                              <div style="float:left; width:80px; height:60px; background:#3498db;"></div>
                              <div style="float:right; width:80px; height:60px; background:#e74c3c;"></div>
                          </div>
                      </body></html>

  - id: pp-float-clear-both
    name: Float Clear Both Behavior
    html: |
      <html><body style="margin:0; padding:20px; background:#fff;">
                          <div style="width:300px;">
                              <div style="float:left; width:100px; height:60px; background:#3498db;"></div>
                              <div style="float:right; width:100px; height:60px; background:#e74c3c;"></div>
                              <div style="clear:both; height:40px; background:#2ecc71;"></div>
                          </div>
                      </body></html>

  - id: pp-float-left-right-clear
    name: Float Left Right with Clear
    html: |
      <html><body style="margin:0; padding:20px; background:#fff;">
                          <div style="width:300px; background:#ecf0f1; overflow:auto;">
                              <div style="float:left; width:80px; height:60px; background:#3498db;"></div>
                              <div style="float:right; width:80px; height:60px; background:#e74c3c;"></div>
                              <div style="clear:both; height:30px; background:#2ecc71;"></div>
                          </div>
                      </body></html>

  - id: pp-float-multiple
    name: Multiple Floated Elements
    html: |
      <html><body style="margin:0; padding:20px; background:#fff;">
                          <div style="width:300px; background:#ecf0f1; overflow:auto; padding:5px;">
                              <div style="float:left; width:60px; height:40px; background:#3498db; margin:3px;"></div>
                              <div style="float:left; width:60px; height:40px; background:#e74c3c; margin:3px;"></div>
                              <div style="float:left; width:60px; height:40px; background:#2ecc71; margin:3px;"></div>
                              <div style="float:left; width:60px; height:40px; background:#f39c12; margin:3px;"></div>
                          </div>
                      </body></html>
