# Flexbox
# Visual regression tests for flexbox
tests:
  - id: flex-grow-ratios
    name: "Flex Grow Ratios (1:2:1)"
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="display:flex; gap:4px;">
                              <div style="flex-grow:1; background:#3498db; height:40px;"></div>
                              <div style="flex-grow:2; background:#e74c3c; height:40px;"></div>
                              <div style="flex-grow:1; background:#27ae60; height:40px;"></div>
                          </div>
                      </body></html>

  - id: flex-shrink
    name: Flex Shrink (items exceed container)
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="display:flex; width:300px;">
                              <div style="flex-shrink:1; width:200px; background:#3498db; height:40px;"></div>
                              <div style="flex-shrink:2; width:200px; background:#e74c3c; height:40px;"></div>
                              <div style="flex-shrink:1; width:200px; background:#27ae60; height:40px;"></div>
                          </div>
                      </body></html>

  - id: flex-direction-column-reverse
    name: Flex Column Reverse
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="display:flex; flex-direction:column-reverse; height:160px;">
                              <div style="background:#3498db; height:40px;"></div>
                              <div style="background:#e74c3c; height:40px;"></div>
                              <div style="background:#27ae60; height:40px;"></div>
                          </div>
                      </body></html>

  - id: flex-align-items-center
    name: Flex Align Items Center
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="display:flex; align-items:center; height:100px; background:#f0f0f0; gap:8px; padding:8px;">
                              <div style="background:#3498db; width:60px; height:30px;"></div>
                              <div style="background:#e74c3c; width:60px; height:60px;"></div>
                              <div style="background:#27ae60; width:60px; height:20px;"></div>
                          </div>
                      </body></html>

  - id: flex-justify-space-around
    name: Flex Justify Space Around
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="display:flex; justify-content:space-around; background:#f0f0f0; padding:8px 0;">
                              <div style="background:#3498db; width:60px; height:40px;"></div>
                              <div style="background:#e74c3c; width:60px; height:40px;"></div>
                              <div style="background:#27ae60; width:60px; height:40px;"></div>
                          </div>
                      </body></html>

  - id: flex-align-self
    name: Flex Align Self (mixed)
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="display:flex; height:100px; background:#f0f0f0; gap:8px; padding:8px;">
                              <div style="background:#3498db; width:60px; align-self:flex-start; height:30px;"></div>
                              <div style="background:#e74c3c; width:60px; align-self:center; height:30px;"></div>
                              <div style="background:#27ae60; width:60px; align-self:flex-end; height:30px;"></div>
                              <div style="background:#f39c12; width:60px; align-self:stretch;"></div>
                          </div>
                      </body></html>

  - id: adv-flex-grow-padding
    name: Flex Grow with Padding on Items
    html: |
      <html><body style="margin:0; padding:10px; font-family:Arial,sans-serif;">
                          <div style="display:flex; gap:4px;">
                              <div style="flex-grow:1; padding:12px; background:#3498db; height:20px;"></div>
                              <div style="flex-grow:2; padding:20px; background:#e74c3c; height:20px;"></div>
                              <div style="flex-grow:1; padding:8px; background:#27ae60; height:20px;"></div>
                          </div>
                      </body></html>

  - id: adv-flex-order
    name: Flex Order Property
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="display:flex; gap:8px;">
                              <div style="order:3; width:80px; height:50px; background:#3498db;"></div>
                              <div style="order:1; width:80px; height:50px; background:#e74c3c;"></div>
                              <div style="order:2; width:80px; height:50px; background:#27ae60;"></div>
                          </div>
                      </body></html>

  - id: adv-flex-shrink-ratio
    name: Flex Shrink Ratio Differences
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="display:flex; width:300px;">
                              <div style="flex:0 1 200px; background:#3498db; height:50px;"></div>
                              <div style="flex:0 3 200px; background:#e74c3c; height:50px;"></div>
                              <div style="flex:0 1 200px; background:#27ae60; height:50px;"></div>
                          </div>
                      </body></html>

  - id: adv-flex-nowrap-overflow
    name: Flex Nowrap Overflow Behavior
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="display:flex; flex-wrap:nowrap; width:200px; overflow:hidden; background:#f0f0f0;">
                              <div style="flex:0 0 100px; height:50px; background:#3498db;"></div>
                              <div style="flex:0 0 100px; height:50px; background:#e74c3c;"></div>
                              <div style="flex:0 0 100px; height:50px; background:#27ae60;"></div>
                          </div>
                      </body></html>

  - id: adv-flex-nested-3-levels
    name: Nested Flex 3 Levels Deep
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="display:flex; gap:6px; height:150px;">
                              <div style="flex:1; display:flex; flex-direction:column; gap:4px;">
                                  <div style="flex:1; display:flex; gap:4px;">
                                      <div style="flex:1; background:#3498db;"></div>
                                      <div style="flex:1; background:#2980b9;"></div>
                                  </div>
                                  <div style="flex:1; background:#1a6fa1;"></div>
                              </div>
                              <div style="flex:1; display:flex; flex-direction:column; gap:4px;">
                                  <div style="flex:1; background:#e74c3c;"></div>
                                  <div style="flex:1; display:flex; gap:4px;">
                                      <div style="flex:1; background:#c0392b;"></div>
                                      <div style="flex:2; background:#a93226;"></div>
                                  </div>
                              </div>
                          </div>
                      </body></html>

  - id: adv-edge-auto-margin-flex
    name: Auto Margin in Flex for Push Layout
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="display:flex; align-items:center; height:50px; background:#f0f0f0; padding:0 10px;">
                              <div style="width:40px; height:30px; background:#3498db; border-radius:4px;"></div>
                              <div style="width:40px; height:30px; background:#e74c3c; border-radius:4px; margin-left:auto;"></div>
                              <div style="width:40px; height:30px; background:#27ae60; border-radius:4px; margin-left:8px;"></div>
                          </div>
                      </body></html>

  - id: adv-edge-inline-flex
    name: Inline Flex Containers
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="display:inline-flex; gap:4px; background:#f0f0f0; padding:6px; margin-right:8px; border-radius:4px;">
                              <div style="width:30px; height:30px; background:#3498db; border-radius:4px;"></div>
                              <div style="width:30px; height:30px; background:#e74c3c; border-radius:4px;"></div>
                          </div>
                          <div style="display:inline-flex; gap:4px; background:#f0f0f0; padding:6px; border-radius:4px;">
                              <div style="width:30px; height:30px; background:#27ae60; border-radius:4px;"></div>
                              <div style="width:30px; height:30px; background:#f39c12; border-radius:4px;"></div>
                              <div style="width:30px; height:30px; background:#9b59b6; border-radius:4px;"></div>
                          </div>
                      </body></html>

  - id: bug062-anon-block-decoration
    name: Anonymous block wrappers have no decoration
    html: |
      <html><body style="margin:0; padding:10px; font-family:sans-serif; font-size:14px;">
      <div style="display:flex; gap:8px;">
          Plain text in flex (should not inherit parent border)
          <div style="background:#3498db; color:#fff; padding:8px;">Flex child</div>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;">
          Grid text (no decoration)
          <div style="background:#e74c3c; color:#fff; padding:8px;">Grid child</div>
      </div>
      </body></html>

