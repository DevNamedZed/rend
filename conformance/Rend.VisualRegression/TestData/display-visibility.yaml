# Display & Visibility
# Visual regression tests for display & visibility
tests:
  - id: display-inline-block-row
    name: Inline Block Elements in Row
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="display:inline-block; width:80px; height:40px; background:#3498db; margin-right:8px;"></div>
                          <div style="display:inline-block; width:80px; height:60px; background:#e74c3c; margin-right:8px;"></div>
                          <div style="display:inline-block; width:80px; height:30px; background:#27ae60;"></div>
                      </body></html>

  - id: display-none-gap
    name: Display None Does Not Take Space
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="background:#3498db; height:30px; margin-bottom:8px;"></div>
                          <div style="display:none; background:#e74c3c; height:30px; margin-bottom:8px;"></div>
                          <div style="background:#27ae60; height:30px;"></div>
                      </body></html>

  - id: visibility-hidden-space
    name: Visibility Hidden Preserves Space
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="background:#3498db; height:30px; margin-bottom:8px;"></div>
                          <div style="visibility:hidden; background:#e74c3c; height:30px; margin-bottom:8px;"></div>
                          <div style="background:#27ae60; height:30px;"></div>
                      </body></html>

  - id: display-contents
    name: Display Contents
    html: |
      <html><body style="margin:0; padding:10px; background:#fff;">
                          <div style="display:flex; gap:8px;">
                              <div style="background:#3498db; padding:10px; height:30px;"></div>
                              <div style="display:contents;">
                                  <div style="background:#e74c3c; padding:10px; height:30px;"></div>
                                  <div style="background:#27ae60; padding:10px; height:30px;"></div>
                              </div>
                              <div style="background:#f39c12; padding:10px; height:30px;"></div>
                          </div>
                      </body></html>

  - id: pp-display-none-skip
    name: Display None Skipped
    html: |
      <html><body style="margin:0; padding:10px; background:#fff;">
                          <div style="height:40px; background:#3498db; margin-bottom:10px;"></div>
                          <div style="display:none; height:100px; background:#e74c3c;"></div>
                          <div style="height:40px; background:#2ecc71;"></div>
                      </body></html>

  - id: pp-visibility-hidden
    name: Visibility Hidden Space
    html: |
      <html><body style="margin:0; padding:10px; background:#fff;">
                          <div style="height:40px; background:#3498db; margin-bottom:10px;"></div>
                          <div style="visibility:hidden; height:40px; background:#e74c3c; margin-bottom:10px;"></div>
                          <div style="height:40px; background:#2ecc71;"></div>
                      </body></html>

  - id: pp-display-inline-block-gap
    name: Inline Block with Whitespace Gap
    html: |
      <html><body style="margin:0; padding:10px; background:#fff; font-size:0;">
                          <div style="display:inline-block; width:80px; height:60px; background:#3498db;"></div>
                          <div style="display:inline-block; width:80px; height:60px; background:#e74c3c;"></div>
                          <div style="display:inline-block; width:80px; height:60px; background:#2ecc71;"></div>
                      </body></html>

  - id: pp-visibility-hidden-space
    name: Visibility Hidden Preserves Space
    html: |
      <html><body style="margin:0; padding:10px; background:#fff;">
                          <div style="height:40px; background:#3498db; margin-bottom:5px;"></div>
                          <div style="visibility:hidden; height:40px; background:#e74c3c; margin-bottom:5px;"></div>
                          <div style="height:40px; background:#2ecc71;"></div>
                      </body></html>

  - id: pp-display-none
    name: Display None Hides Element
    html: |
      <html><body style="margin:0; padding:20px; background:#fff;">
                          <div style="width:200px; height:40px; background:#3498db;"></div>
                          <div style="width:200px; height:40px; background:#e74c3c; display:none;"></div>
                          <div style="width:200px; height:40px; background:#2ecc71; margin-top:10px;"></div>
                      </body></html>

  - id: pp-visibility-hidden-2
    name: Visibility Hidden Reserves Space
    html: |
      <html><body style="margin:0; padding:20px; background:#fff;">
                          <div style="width:200px; height:40px; background:#3498db;"></div>
                          <div style="width:200px; height:40px; background:#e74c3c; visibility:hidden; margin-top:10px;"></div>
                          <div style="width:200px; height:40px; background:#2ecc71; margin-top:10px;"></div>
                      </body></html>

  - id: pp-display-none-sibling
    name: Display None Between Siblings
    html: |
      <html><body style="margin:0; padding:20px; background:#fff;">
                          <div style="width:200px; height:40px; background:#3498db;"></div>
                          <div style="display:none; width:200px; height:40px; background:#f39c12;"></div>
                          <div style="width:200px; height:40px; background:#e74c3c;"></div>
                      </body></html>

  - id: pp-visibility-hidden-layout
    name: Visibility Hidden Preserves Layout
    html: |
      <html><body style="margin:0; padding:20px; background:#fff;">
                          <div style="display:flex; gap:10px; width:250px;">
                              <div style="width:60px; height:50px; background:#3498db;"></div>
                              <div style="width:60px; height:50px; background:#e74c3c; visibility:hidden;"></div>
                              <div style="width:60px; height:50px; background:#2ecc71;"></div>
                          </div>
                      </body></html>

  - id: display-none
    name: Display None
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="background:#3498db; height:40px; margin-bottom:5px;"></div>
                          <div style="background:#e74c3c; height:40px; display:none;"></div>
                          <div style="background:#27ae60; height:40px;"></div>
                      </body></html>

  - id: visibility-hidden
    name: Visibility Hidden
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="background:#3498db; height:40px; margin-bottom:5px;"></div>
                          <div style="background:#e74c3c; height:40px; margin-bottom:5px; visibility:hidden;"></div>
                          <div style="background:#27ae60; height:40px;"></div>
                      </body></html>

  - id: display-inline-block
    name: Inline Block
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="display:inline-block; background:#3498db; width:80px; height:60px; margin-right:5px;"></div>
                          <div style="display:inline-block; background:#e74c3c; width:80px; height:60px; margin-right:5px;"></div>
                          <div style="display:inline-block; background:#27ae60; width:80px; height:60px;"></div>
                      </body></html>
