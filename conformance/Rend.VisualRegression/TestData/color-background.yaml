# Color & Background
# Visual regression tests for color & background
tests:
  - id: bug044-var-cycle
    name: var() cyclic reference (no crash)
    html: |
      <html><head><style>
      :root { --a: var(--b); --b: var(--a); --c: var(--c); }
      </style></head><body style="margin:0; padding:10px; font-family:sans-serif; font-size:14px;">
      <div style="color: var(--a); background: #eee; padding:10px;">Cycle: should render in default color</div>
      <div style="width: var(--c, 200px); height:40px; background:#3498db; margin-top:8px;"></div>
      </body></html>

  - id: bug047-var-fallback
    name: var() multi-token fallback
    html: |
      <html><head><style>
      :root { /* --font not defined */ }
      </style></head><body style="margin:0; padding:10px;">
      <p style="font-family: var(--font, Arial, sans-serif); font-size:16px;">Should use Arial/sans-serif fallback</p>
      <div style="background: var(--bg, linear-gradient(to right, #3498db, #e74c3c)); height:40px; margin-top:8px;"></div>
      <div style="border: var(--border, 2px solid #333); padding:8px; margin-top:8px;">Fallback border</div>
      </body></html>

  - id: bugfix-var-resolution
    name: CSS custom properties var() resolution
    html: |
      <html><head><style>
      :root {
          --primary: #3498db;
          --secondary: #e74c3c;
          --spacing: 12px;
          --radius: 6px;
          --nested: var(--primary);
      }
      </style></head><body style="margin:0; padding:10px; font-family:sans-serif; font-size:14px;">
      <div style="background:var(--primary); color:#fff; padding:var(--spacing); border-radius:var(--radius); margin-bottom:8px;">Primary color box</div>
      <div style="background:var(--secondary); color:#fff; padding:var(--spacing); border-radius:var(--radius); margin-bottom:8px;">Secondary color box</div>
      <div style="background:var(--nested); color:#fff; padding:var(--spacing); border-radius:var(--radius); margin-bottom:8px;">Nested var (should be primary)</div>
      <div style="background:var(--undefined, #27ae60); color:#fff; padding:var(--spacing); border-radius:var(--radius);">Fallback color (green)</div>
      </body></html>

  - id: bugfix-var-inheritance
    name: CSS custom property inheritance
    html: |
      <html><head><style>
      :root { --color: #3498db; --size: 16px; }
      .parent { --color: #e74c3c; }
      .child { --color: #27ae60; }
      </style></head><body style="margin:0; padding:10px; font-family:sans-serif; font-size:var(--size);">
      <div style="color:var(--color); padding:6px; background:#f0f0f0; margin-bottom:6px;">Root color (blue)</div>
      <div class="parent" style="color:var(--color); padding:6px; background:#f0f0f0; margin-bottom:6px;">
          Parent override (red)
          <div class="child" style="color:var(--color); padding:6px; background:#e8e8e8;">Child override (green)</div>
      </div>
      </body></html>

  - id: bugfix-var-complex
    name: Complex var() nesting and fallbacks
    html: |
      <html><head><style>
      :root {
          --base-color: #3498db;
          --derived: var(--base-color);
          --border-style: 2px solid var(--base-color);
          --missing-with-fallback: var(--undefined, var(--base-color));
      }
      </style></head><body style="margin:0; padding:10px; font-family:sans-serif; font-size:14px;">
      <div style="background:var(--base-color); color:#fff; padding:10px; margin-bottom:6px; border-radius:4px;">Base color</div>
      <div style="background:var(--derived); color:#fff; padding:10px; margin-bottom:6px; border-radius:4px;">Derived (same)</div>
      <div style="border:var(--border-style); padding:10px; margin-bottom:6px; border-radius:4px;">Border from var</div>
      <div style="background:var(--missing-with-fallback); color:#fff; padding:10px; border-radius:4px;">Nested fallback</div>
      </body></html>

  - id: color-solid
    name: Solid Colors
    html: |
      <html><body style="margin:0; padding:10px; font-family:sans-serif; font-size:14px; line-height:1.4;">
                          <p style="color:#e74c3c; margin:0 0 4px 0;">Red text (#e74c3c)</p>
                          <p style="color:#27ae60; margin:0 0 4px 0;">Green text (#27ae60)</p>
                          <p style="color:#3498db; margin:0 0 4px 0;">Blue text (#3498db)</p>
                          <p style="color:#8e44ad; margin:0 0 4px 0;">Purple text (#8e44ad)</p>
                          <p style="color:rgb(230, 126, 34); margin:0;">Orange text (rgb)</p>
                      </body></html>

  - id: color-background
    name: Background Colors
    html: |
      <html><body style="margin:0; padding:10px; font-family:sans-serif; font-size:14px; line-height:1.4;">
                          <div style="background:#e74c3c; color:#fff; padding:10px; margin-bottom:6px; height:20px;">Red background</div>
                          <div style="background:#27ae60; color:#fff; padding:10px; margin-bottom:6px; height:20px;">Green background</div>
                          <div style="background:#3498db; color:#fff; padding:10px; margin-bottom:6px; height:20px;">Blue background</div>
                          <div style="background:#2c3e50; color:#ecf0f1; padding:10px; height:20px;">Dark background</div>
                      </body></html>

  - id: color-gradient
    name: Linear Gradient
    html: |
      <html><body style="margin:0; padding:10px; font-family:sans-serif; font-size:14px; line-height:1.4;">
                          <div style="background:linear-gradient(to right, #3498db, #8e44ad); color:#fff; padding:20px; margin-bottom:10px; border-radius:4px; height:20px;">Horizontal gradient</div>
                          <div style="background:linear-gradient(to bottom, #e74c3c, #f39c12); color:#fff; padding:20px; border-radius:4px; height:20px;">Vertical gradient</div>
                      </body></html>

  - id: color-repeating-gradient
    name: Repeating Linear Gradient
    html: |
      <html><body style="margin:0; padding:10px; background:#fff;">
                          <div style="height:80px; margin-bottom:8px; border-radius:6px; background:repeating-linear-gradient(45deg, #606dbc, #606dbc 10px, #465298 10px, #465298 20px);"></div>
                          <div style="height:80px; border-radius:6px; background:repeating-linear-gradient(90deg, #e74c3c 0px, #e74c3c 5px, #fff 5px, #fff 10px);"></div>
                      </body></html>

  - id: color-radial-gradient
    name: Radial Gradient
    html: |
      <html><body style="margin:0; padding:10px; background:#fff;">
                          <div style="height:80px; margin-bottom:8px; border-radius:6px; background:radial-gradient(circle at 30% 30%, #f093fb 0%, #f5576c 100%);"></div>
                          <div style="height:80px; border-radius:6px; background:radial-gradient(ellipse at center, #667eea 0%, #764ba2 100%);"></div>
                      </body></html>

  - id: color-multi-stop-gradient
    name: Multi-Stop Gradient
    html: |
      <html><body style="margin:0; padding:10px; background:#fff;">
                          <div style="height:80px; border-radius:6px; background:linear-gradient(45deg, #FF6B6B, #FFA07A, #FFD700, #90EE90, #87CEEB, #9370DB);"></div>
                      </body></html>

  - id: color-opacity-overlap
    name: Opacity Overlapping Positioned
    html: |
      <html><body style="margin:0; padding:10px; background:#fff;">
                          <div style="position:relative; height:100px;">
                              <div style="position:absolute; left:10px; top:10px; width:100px; height:60px; background:rgba(231,76,60,0.8); border-radius:6px;"></div>
                              <div style="position:absolute; left:70px; top:20px; width:100px; height:60px; background:rgba(52,152,219,0.8); border-radius:6px;"></div>
                              <div style="position:absolute; left:130px; top:5px; width:100px; height:60px; background:rgba(46,204,113,0.8); border-radius:6px;"></div>
                              <div style="position:absolute; left:190px; top:30px; width:100px; height:60px; background:rgba(243,156,18,0.8); border-radius:6px;"></div>
                          </div>
                      </body></html>

  - id: color-bg-image-tile
    name: Background Image Tiling
    html: |
      <html><body style="margin:0; padding:10px; background:#fff;">
                          <div style="height:120px; border:1px solid #ddd; border-radius:6px; background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAoAAAAKCAYAAACNMs+9AAAAMklEQVQYV2N89+7dfwYGBgZGRkYGBgYmBjIBE5maCRpIdCBxBhI0kKiBRA0kaiBRAwEAmYQLGFJt11IAAAAASUVORK5CYII=); background-size:20px 20px;"></div>
                      </body></html>

  - id: color-opacity
    name: Opacity
    html: |
      <html><body style="margin:0; padding:10px; font-family:sans-serif; font-size:14px; line-height:1.4; background:#ecf0f1;">
                          <div style="background:#e74c3c; color:#fff; padding:10px; margin-bottom:6px; opacity:1.0; height:20px;">Opacity 1.0</div>
                          <div style="background:#e74c3c; color:#fff; padding:10px; margin-bottom:6px; opacity:0.75; height:20px;">Opacity 0.75</div>
                          <div style="background:#e74c3c; color:#fff; padding:10px; margin-bottom:6px; opacity:0.5; height:20px;">Opacity 0.5</div>
                          <div style="background:#e74c3c; color:#fff; padding:10px; opacity:0.25; height:20px;">Opacity 0.25</div>
                      </body></html>

  - id: color-hex-3digit
    name: 3-Digit Hex Colors
    html: |
      <html><body style="margin:0; padding:10px; background:#fff;">
                          <div style="display:flex; gap:4px;">
                              <div style="width:50px; height:50px; background:#f00;"></div>
                              <div style="width:50px; height:50px; background:#0f0;"></div>
                              <div style="width:50px; height:50px; background:#00f;"></div>
                              <div style="width:50px; height:50px; background:#ff0;"></div>
                              <div style="width:50px; height:50px; background:#0ff;"></div>
                          </div>
                      </body></html>

  - id: color-named-basic
    name: Named CSS Colors
