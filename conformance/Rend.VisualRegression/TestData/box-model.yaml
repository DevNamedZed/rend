                          <div style="background:#ecf0f1; padding:20px 30px 10px 40px; width:200px;">
                              <div style="height:50px; background:#3498db;"></div>
                          </div>
                      </body></html>

  - id: box-sizing-border-box
    name: Box Sizing Border Box
