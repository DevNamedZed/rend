# Box Model
# Visual regression tests for box model
tests:
  - id: box-nested-margins
    name: Nested Margins and Padding
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="background:#ecf0f1; padding:15px;">
                              <div style="background:#3498db; padding:10px; margin-bottom:10px;">
                                  <div style="background:#2980b9; height:30px;"></div>
                              </div>
                              <div style="background:#e74c3c; padding:10px;">
                                  <div style="background:#c0392b; height:30px;"></div>
                              </div>
                          </div>
                      </body></html>

  - id: box-border-styles
    name: "Border Styles (solid, dashed, dotted)"
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="border:3px solid #333; padding:8px; margin-bottom:8px; height:20px;"></div>
                          <div style="border:3px dashed #e74c3c; padding:8px; margin-bottom:8px; height:20px;"></div>
                          <div style="border:3px dotted #3498db; padding:8px; height:20px;"></div>
                      </body></html>

  - id: box-individual-borders
    name: Individual Border Sides
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="border-top:4px solid #e74c3c; border-right:4px solid #3498db; border-bottom:4px solid #27ae60; border-left:4px solid #f39c12; padding:15px; height:40px; background:#f9f9f9;"></div>
                      </body></html>

  - id: box-large-border-radius
    name: Large Border Radius (pill shape)
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="background:#3498db; border-radius:25px; width:200px; height:50px; margin-bottom:10px;"></div>
                          <div style="background:#e74c3c; border-radius:50%; width:80px; height:80px;"></div>
                      </body></html>

  - id: adv-box-negative-margins
    name: Negative Margins Overlap
    html: |
      <html><body style="margin:0; padding:20px;">
                          <div style="background:#3498db; width:200px; height:60px;"></div>
                          <div style="background:#e74c3c; width:200px; height:60px; margin-top:-20px; margin-left:30px;"></div>
                          <div style="background:#27ae60; width:200px; height:60px; margin-top:-20px; margin-left:60px;"></div>
                      </body></html>

  - id: adv-box-overflow-auto-dims
    name: Overflow Auto with Fixed Dimensions
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="width:180px; height:100px; overflow:auto; border:2px solid #333; padding:8px;">
                              <div style="background:#3498db; width:250px; height:40px; margin-bottom:4px;"></div>
                              <div style="background:#e74c3c; width:150px; height:40px; margin-bottom:4px;"></div>
                              <div style="background:#27ae60; width:200px; height:40px;"></div>
                          </div>
                      </body></html>

  - id: adv-box-sizing-padding
    name: Box Sizing Border Box with Large Padding
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="width:200px; height:80px; box-sizing:border-box; padding:25px; border:5px solid #333; background:#3498db; margin-bottom:10px;"></div>
                          <div style="width:200px; height:80px; box-sizing:content-box; padding:25px; border:5px solid #333; background:#e74c3c;"></div>
                      </body></html>

  - id: adv-edge-empty-blocks
    name: Empty Block Elements with Various Heights
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="background:#3498db; height:0; margin-bottom:4px;"></div>
                          <div style="background:#e74c3c; height:20px; margin-bottom:4px;"></div>
                          <div style="background:#27ae60; height:0; border-top:2px solid #1e8449; margin-bottom:4px;"></div>
                          <div style="background:#f39c12; height:30px; margin-bottom:4px;"></div>
                          <div style="height:0; margin-bottom:4px;"></div>
                          <div style="background:#9b59b6; height:40px;"></div>
                      </body></html>

  - id: box-fixed-width-height
    name: Fixed Width and Height
    html: |
      <html><body style="margin:0; padding:10px; background:#fff;">
                          <div style="width:150px; height:80px; background:#3498db;"></div>
                      </body></html>

  - id: box-percentage-width
    name: Percentage Width
