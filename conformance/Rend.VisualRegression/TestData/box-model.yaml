                          <div style="min-width:200px; width:10%; height:40px; background:#e74c3c; margin-bottom:8px;"></div>
                          <div style="max-width:150px; width:80%; height:40px; background:#2ecc71;"></div>
                      </body></html>

  - id: box-border-widths
