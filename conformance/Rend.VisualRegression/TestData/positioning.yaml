# Positioning
# Visual regression tests for positioning
tests:
  - id: pos-absolute-corners
    name: Absolute Positioning All Corners
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="position:relative; width:200px; height:150px; background:#ecf0f1; border:1px solid #bdc3c7;">
                              <div style="position:absolute; top:5px; left:5px; width:30px; height:30px; background:#e74c3c;"></div>
                              <div style="position:absolute; top:5px; right:5px; width:30px; height:30px; background:#3498db;"></div>
                              <div style="position:absolute; bottom:5px; left:5px; width:30px; height:30px; background:#27ae60;"></div>
                              <div style="position:absolute; bottom:5px; right:5px; width:30px; height:30px; background:#f39c12;"></div>
                          </div>
                      </body></html>

  - id: pos-sticky-basic
    name: Relative Offset Positioning
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="background:#3498db; height:30px; width:100px; margin-bottom:5px;"></div>
                          <div style="position:relative; left:20px; top:-10px; background:#e74c3c; height:30px; width:100px; margin-bottom:5px;"></div>
                          <div style="background:#27ae60; height:30px; width:100px;"></div>
                      </body></html>

  - id: adv-pos-sticky-in-scroll
    name: Sticky Element in Scrollable Container
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="height:200px; overflow:auto; border:1px solid #ccc;">
                              <div style="position:sticky; top:0; background:#2c3e50; height:30px; z-index:1;"></div>
                              <div style="background:#3498db; height:50px; margin:4px 0;"></div>
                              <div style="background:#e74c3c; height:50px; margin:4px 0;"></div>
                              <div style="background:#27ae60; height:50px; margin:4px 0;"></div>
                              <div style="background:#f39c12; height:50px; margin:4px 0;"></div>
                              <div style="background:#9b59b6; height:50px; margin:4px 0;"></div>
                          </div>
                      </body></html>

  - id: adv-pos-absolute-in-relative
    name: Absolute Positioned Inside Relative Parent
    html: |
      <html><body style="margin:0; padding:10px;">
                          <div style="position:relative; width:300px; height:200px; background:#ecf0f1; margin:20px;">
                              <div style="position:absolute; top:10px; left:10px; width:120px; height:80px; background:#3498db;"></div>
                              <div style="position:absolute; top:50px; left:50px; width:120px; height:80px; background:#e74c3c;"></div>
                              <div style="position:absolute; top:90px; left:90px; width:120px; height:80px; background:#27ae60;"></div>
                          </div>
                      </body></html>

  - id: adv-pos-stacking-contexts
    name: Stacking Contexts with Nested Z-Index
    html: |
      <html><body style="margin:0; padding:20px;">
                          <div style="position:relative; z-index:1;">
                              <div style="position:absolute; top:0; left:0; width:150px; height:100px; background:#3498db; z-index:10;"></div>
                          </div>
                          <div style="position:relative; z-index:2;">
                              <div style="position:absolute; top:30px; left:30px; width:150px; height:100px; background:#e74c3c; z-index:1;"></div>
                          </div>
                      </body></html>

  - id: adv-pos-fixed-corners
    name: Fixed Position in All Corners
    html: |
      <html><body style="margin:0;">
                          <div style="position:fixed; top:10px; left:10px; width:60px; height:40px; background:#3498db;"></div>
                          <div style="position:fixed; top:10px; right:10px; width:60px; height:40px; background:#e74c3c;"></div>
                          <div style="position:fixed; bottom:10px; left:10px; width:60px; height:40px; background:#27ae60;"></div>
                          <div style="position:fixed; bottom:10px; right:10px; width:60px; height:40px; background:#f39c12;"></div>
                      </body></html>

  - id: bug048-negative-subpixel
    name: Negative sub-pixel values (not percentages)
    html: |
      <html><body style="margin:0; padding:20px; font-family:sans-serif; font-size:14px;">
      <div style="position:relative; width:200px; height:100px; background:#eee; border:1px solid #999;">
          <div style="position:absolute; top:-0.5px; left:-0.5px; width:50px; height:50px; background:#3498db;"></div>
          <div style="position:absolute; bottom:-0.5px; right:-0.5px; width:50px; height:50px; background:#e74c3c;"></div>
      </div>
      <div style="margin-top:10px;">
          <div style="position:relative; width:300px; height:60px; background:#f0f0f0; border:1px solid #ccc;">
              <div style="position:absolute; top:50%; left:50%; width:80px; height:30px; background:#27ae60; transform:translate(-50%,-50%);"></div>
          </div>
      </div>
      </body></html>

